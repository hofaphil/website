worker_processes  1;

events {
  worker_connections  1024;
}

http {
  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml;
  gzip_min_length 256;

  server {
    listen 8080;
    root   /usr/share/nginx/html;

    location / {
      try_files $uri /index.html;
    }
  }
}
