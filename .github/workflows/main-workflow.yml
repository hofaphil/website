name: Main Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/philipphofer-website:latest
            ghcr.io/${{ github.repository_owner }}/philipphofer-website:${{ steps.date.outputs.date }}
      - name: Tell n8n to pull the new image
        # GET without auth to the URL in the N8N_SERVER_PULL_WEBHOOK secret; skipped when not set
        if: github.event_name != 'pull_request'
        env:
          WEBHOOK_URL: ${{ secrets.N8N_SERVER_PULL_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "N8N_SERVER_PULL_WEBHOOK is not set; skipping."
            exit 0
          fi
          curl -fsS --retry 3 --max-time 30 -o /dev/null "$WEBHOOK_URL"
